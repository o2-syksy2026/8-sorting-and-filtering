<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="t">
  <title id="t">Suodatus ja lajittelu: sekalaiset pylväät, joista poistetaan yksi ja loput järjestetään kasvavaan järjestykseen</title>
  <rect x="1" y="1" width="318" height="168" rx="14" fill="#fbf7f0" stroke="#dcd8ce"/>
  <line x1="18" y1="134" x2="134" y2="134" stroke="#1c2327" stroke-width="2"/>
  <line x1="186" y1="134" x2="302" y2="134" stroke="#1c2327" stroke-width="2"/>
  <!-- ennen: epäjärjestyksessä, yksi poistettu -->
  <g fill="#b74a26">
    <rect x="24" y="62" width="16" height="72" rx="3"/>
    <rect x="46" y="104" width="16" height="30" rx="3"/>
    <rect x="90" y="40" width="16" height="94" rx="3"/>
    <rect x="112" y="86" width="16" height="48" rx="3"/>
  </g>
  <rect x="68" y="74" width="16" height="60" rx="3" fill="#fbf7f0" stroke="#9a9ea1" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M70 58 l12 12 m0 -12 l-12 12" stroke="#a4262c" stroke-width="3" stroke-linecap="round"/>
  <!-- nuoli -->
  <path d="M144 96 H170" stroke="#5f6b70" stroke-width="3" stroke-linecap="round"/>
  <path d="M164 88 L174 96 L164 104" fill="none" stroke="#5f6b70" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- jälkeen: kasvava järjestys -->
  <g fill="#2d6a4f">
    <rect x="198" y="104" width="16" height="30" rx="3"/>
    <rect x="222" y="86" width="16" height="48" rx="3"/>
    <rect x="246" y="62" width="16" height="72" rx="3"/>
    <rect x="270" y="40" width="16" height="94" rx="3"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
    <text x="24" y="156" fill="#8c3419">filter</text>
    <text x="226" y="156" fill="#2d6a4f">sort</text>
  </g>
  <text x="24" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#5f6b70">deletedAt ≠ null</text>
  <text x="196" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#5f6b70">publishedAt ↑</text>
</svg>
